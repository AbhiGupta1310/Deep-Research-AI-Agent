[project]
name = "deep-research-agent"
version = "0.1.0"
description = "Autonomous research agent using LangGraph and FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "langgraph>=0.0.10",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-community>=0.0.10",
    "tavily-python>=0.3.0",
    "python-dotenv>=1.0.0",
    "pdfkit>=1.0.0",
    "markdown>=3.5.0",
    "aiofiles>=23.2.1"
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
